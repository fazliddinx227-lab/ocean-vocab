 return fbDb.collection('users').doc(u.uid).get().then(function(d){var o=d.exists?d.data().p:null;if(o)fromObj(o);else K=loc}).catch(function(){K=loc}).then(function(){goMenu()})}

 var n=uname($('uin').value),p=$('pw').value;
 if(!uok(n)){err('Username: 3-20 characters, letters, digits, _ . - only.');return}
 if(p.length<6){err('Password must be at least 6 characters.');return}
 if(amd==='signup'&&p!==$('pw2').value){err('Passwords do not match.');return}
 $('start').disabled=true;err('Please wait...');
 var pr=amd==='signup'?fbAuth.createUserWithEmailAndPassword(uem(n),p):fbAuth.signInWithEmailAndPassword(uem(n),p);
 pr.then(function(c){$('pw').value='';$('pw2').value='';err('');if(amd==='signup')return fbDb.collection('users').doc(c.user.uid).set({u:n,p:{}}).catch(function(){})})
  .catch(function(e){err(aerr(e))}).then(function(){$('start').disabled=false})}
if(FB_CONFIG&&typeof firebase!=='undefined'){try{
 firebase.initializeApp(FB_CONFIG);fbAuth=firebase.auth();fbDb=firebase.firestore();acct=true;
 $('tabs').style.display='';$('pw').style.display='';$('uch').style.display='none';$('uin').placeholder='Username';
 $('uin').value='';$('swu').style.display='none';$('codebox').style.display='none';
 $('uerr').textContent='Loading...';$('start').disabled=true;
 $('start').onclick=begin;$('tl').onclick=function(){amode('login')};$('ts').onclick=function(){amode('signup')};
 $('pw').onkeydown=$('pw2').onkeydown=function(e){if(e.key==='Enter')begin()};
 fbAuth.onAuthStateChanged(function(u){$('start').disabled=false;
  if(u){afterLogin(u)}else{cu=null;uk='';K={};$('hb').style.display='none';$('pn').classList.remove('on');$('uerr').textContent='';show('intro')}});
}catch(e){acct=false}}
if(!acct){$('pcp').style.display='none';$('plo').textContent='Switch user'}
$('hb').onclick=function(){$('pn').classList.toggle('on')};
document.addEventListener('click',function(e){if(!e.target.closest('.bar'))$('pn').classList.remove('on')});
$('pcp').onclick=function(){var f=$('pcf');f.style.display=f.style.display==='none'?'block':'none'};
$('plo').onclick=function(){$('pn').classList.remove('on');if(acct){push();fbAuth.signOut()}else{buildU();$('hb').style.display='none';show('intro')}};
$('pcs').onclick=function(){var m=$('pcm'),a=$('pc0').value,b=$('pc1').value,c=$('pc2').value;m.className='msg no';
 if(b.length<6){m.textContent='New password must be at least 6 characters.';return}
 if(b!==c){m.textContent='Passwords do not match.';return}
 cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email,a)).then(function(){return cu.updatePassword(b)})
  .then(function(){m.className='msg ok';m.textContent='Password changed.';$('pc0').value='';$('pc1').value='';$('pc2').value=''}).catch(function(e){m.textContent=aerr(e)})};
document.addEventListener('visibilitychange',function(){if(document.hidden)push()});
buildU();
$('swu').onclick=function(){buildU();show('intro')};
function enc(){var o={};SETS.forEach(function(s){var str='',any=false;flat(s).forEach(function(w){var v=K[w[2]]||0;if(v)any=true;str+=v.toString(16)});if(any)o[s.name]=str});
 return 'OV1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(c){c=c.trim();if(c.indexOf('OV1.')!==0)return -1;var o;
 try{o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))))}catch(e){return -1}
 var n=0;SETS.forEach(function(s){var str=o[s.name];if(!str)return;flat(s).forEach(function(w,k){var v=parseInt(str.charAt(k)||'0',16)||0;if(v&~(K[w[2]]||0)){K[w[2]]=(K[w[2]]||0)|v;n++}})});save();return n}
var cmode='';
function cshow(m,t){cmode=m;$('cb').style.display='block';$('cok').style.display='block';$('cok').textContent=t}
$('cg').onclick=function(){cshow('g','Nusxalash');$('cb').value=enc();$('cm').textContent="Kodni nusxalab, boshqa qurilmada \"Kod kiritish\"ga qo'ying."};
$('ci').onclick=function(){cshow('i','Yuklash');$('cb').value='';$('cm').textContent="Boshqa qurilmadan olingan kodni shu yerga qo'ying."};
$('cok').onclick=function(){
 if(cmode==='g'){$('cb').select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  if(!ok&&navigator.clipboard)navigator.clipboard.writeText($('cb').value).catch(function(){});$('cm').textContent="Nusxalandi (bo'lmasa, qo'lda belgilab nusxalang)."}
 else{var n=dec($('cb').value);if(n<0)$('cm').textContent="Kod noto'g'ri.";else{goMenu();$('cm').textContent="Yuklandi: "+n+" ta so'z yangilandi."}}};
function goMenu(){
 $('hb').style.display='';$('pn').classList.remove('on');var h=$('sets');h.innerHTML='';
 var items=SETS.map(function(s){return{n:s.name,g:s.g,secs:s.sections,w:flat(s)}});
 items.push({n:"Hammasi aralash",g:"Hammasi",secs:[],w:ALL});
 var lg='';
 items.forEach(function(it){
  if(it.g!==lg){lg=it.g;var gw=[];items.forEach(function(x){if(x.g===lg&&lg!=='Hammasi')gw=gw.concat(x.w)});
   var gh=document.createElement('div');gh.className='gh';gh.textContent=lg+(gw.length?' · '+pc(gw)+'%':'');h.appendChild(gh)}
  var b=document.createElement('button');b.className='set';
  var sp=document.createElement('span');sp.style.flex='1';sp.textContent=it.n;
  var sm=document.createElement('small');sm.textContent=it.w.length+" ta so'z · "+pc(it.w)+"%";sp.appendChild(sm);
  var pb=document.createElement('div');pb.className='pb';pb.innerHTML='<i style="width:'+pc(it.w)+'%"></i>';sp.appendChild(pb);
  b.appendChild(sp);b.appendChild(document.createTextNode(' ›'));
  b.onclick=function(){cur=it;chips();goMode()};h.appendChild(b)});
 show('menu');
}
function goMode(){$('mt').textContent=cur.n;var n=cur.w.length,f=0;cur.w.forEach(function(w){if(bits(K[w[2]]||0)===4)f++});
 $('mp').textContent=pc(cur.w)+"% yodlandi · 4 o'yinda ham topilgan: "+f+" / "+n;
 $('s1').textContent="Bosib tarjimani ko'ring · "+nk(cur.w,1)+"/"+n;$('s2').textContent="4 variantdan toping · "+nk(cur.w,2)+"/"+n;
 $('s3').textContent="Juftlarni toping · "+nk(cur.w,4)+"/"+n;$('s4').textContent="Inglizchasini yozing · "+nk(cur.w,8)+"/"+n;show('mode')}
function chips(){
 var c=$('chips');c.innerHTML='';var opts=[{n:"Hammasi",w:cur.w}];
 if(cur.secs.length>1)opts=opts.concat(cur.secs);
 pool=cur.w;if(opts.length<2)return;
 opts.forEach(function(o,k){var b=document.createElement('button');b.className='chip'+(k===0?' on':'');
  b.textContent=o.n+' ('+o.w.length+')';
  b.onclick=function(){pool=o.w;[].forEach.call(c.children,function(x){x.classList.remove('on')});b.classList.add('on')};c.appendChild(b)});
}
$('mb').onclick=goMenu;
var armed=false;
$('rs').onclick=function(){var b=this;
 if(!armed){armed=true;b.textContent='Aniqmi? Yana bosing';setTimeout(function(){armed=false;b.textContent='Natijani nolga tushirish'},3000);return}
 armed=false;b.textContent='Natijani nolga tushirish';cur.w.forEach(function(w){delete K[w[2]]});save();goMode()};
/* flashcard */
$('mf').onclick=function(){order=pool.slice();i=0;showCard();show('flash')};
function showCard(){flip=false;var c=$('fc');c.classList.remove('back');c.textContent=order[i][0];$('fn').textContent=(i+1)+' / '+order.length;kb()}
function kb(){$('fk').textContent=((K[order[i][2]]||0)&1)?'Yodlandi ✓':'Bilaman ✓'}
$('fc').onclick=function(){flip=!flip;this.classList.toggle('back',flip);this.textContent=order[i][flip?1:0]};
$('fk').onclick=function(){var w=order[i];K[w[2]]=(K[w[2]]||0)^1;if(!K[w[2]])delete K[w[2]];save();kb()};
$('fx').onclick=function(){i=(i+1)%order.length;showCard()};
$('fp').onclick=function(){i=(i-1+order.length)%order.length;showCard()};
$('fs').onclick=function(){order=sh(order);i=0;showCard()};
$('fb').onclick=goMode;
/* quiz */
$('mq').onclick=startQ;
function startQ(){order=pri(pool,2).slice(0,30);i=0;score=0;ask();show('quiz')}
function ask(){
 $('qx').style.display='none';var o=$('qo');o.innerHTML='';
 if(i>=order.length){$('qn').textContent='Tugadi';$('qw').innerHTML='<div class="score">'+score+' / '+order.length+'</div>';
  var b=document.createElement('button');b.textContent='Qayta boshlash';b.style.width='100%';b.onclick=startQ;o.appendChild(b);return}
 var w=order[i];$('qn').textContent=(i+1)+' / '+order.length;$('qw').textContent=w[0];
 var opts=sh(ALL.filter(function(x){return x[1]!==w[1]})).slice(0,3).concat([w]);
 sh(opts).forEach(function(x){var b=document.createElement('button');b.className='opt';b.textContent=x[1];
  b.onclick=function(){var all=o.children;for(var k=0;k<all.length;k++){all[k].disabled=true;if(all[k].textContent===w[1])all[k].classList.add('ok')}
   if(x===w){score++;mark(w,2)}else b.classList.add('no');$('qx').style.display='block'};o.appendChild(b)});
}
$('qx').onclick=function(){i++;ask()};
$('qb').onclick=goMode;
/* matching */
var mo=[],mp=0,msel=null,mleft=0;
$('mm').onclick=function(){mo=pri(pool,4);mp=0;round();show('match')};
function round(){
 var ws=mo.slice(mp,mp+6);mp+=6;mleft=ws.length;msel=null;$('mx').style.display='none';
 $('mn').textContent='Raund '+Math.ceil(mp/6)+' / '+Math.ceil(mo.length/6)+" — juftlarni toping";
 var g=$('mg');g.innerHTML='';var l=document.createElement('div'),r=document.createElement('div');
 sh(ws).forEach(function(w){l.appendChild(mbtn(w,0))});sh(ws).forEach(function(w){r.appendChild(mbtn(w,1))});
 g.appendChild(l);g.appendChild(r);
}
function mbtn(w,s){var b=document.createElement('button');b.className='opt mc';b.textContent=w[s];b.w=w;b.s=s;b.onclick=function(){pick(b)};return b}
function pick(b){
 if(b.classList.contains('ok'))return;
 if(!msel||msel.s===b.s){if(msel)msel.classList.remove('sel');msel=b;b.classList.add('sel');return}
 var a=msel;msel=null;a.classList.remove('sel');
 if(a.w===b.w){a.classList.add('ok');b.classList.add('ok');mark(b.w,4);mleft--;if(!mleft)endRound()}
 else{a.classList.add('no');b.classList.add('no');setTimeout(function(){a.classList.remove('no');b.classList.remove('no')},500)}
}
function endRound(){
 if(mp<mo.length){$('mn').textContent='Raund tugadi!';$('mx').style.display='block'}
 else $('mn').textContent='Hammasi tugadi! Yodlandi: '+pc(cur.w)+'%';
}
$('mx').onclick=round;$('mbk').onclick=goMode;
/* typing */
var tw=null,tst=0;
function tnorm(s){return s.toLowerCase().replace(/\[[^\]]*\]|\([^)]*\)/g,'').replace(/['’`]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function talts(en){return en.replace(/\[[^\]]*\]|\([^)]*\)/g,'').split('/').map(tnorm).filter(Boolean)}
$('mw').onclick=startT;
function startT(){order=pri(pool,8).slice(0,20);i=0;score=0;show('typ');task()}
function task(){
 $('tf').textContent='';$('tf').className='msg';$('th').textContent='';
 if(i>=order.length){tst=2;$('tn').textContent='Tugadi';$('tq').innerHTML='<div class="score">'+score+' / '+order.length+'</div>';$('ti').style.display='none';$('th2').style.display='none';$('tc').textContent='Qayta boshlash';return}
 tst=0;tw=order[i];$('ti').style.display='';$('ti').disabled=false;$('ti').value='';$('th2').style.display='';$('tc').textContent='Tekshirish';
 $('tn').textContent=(i+1)+' / '+order.length;$('tq').textContent=tw[1];setTimeout(function(){$('ti').focus()},60);
}
function check(){
 var v=tnorm($('ti').value);if(!v)return;
 var ok=[tw].concat(ALL.filter(function(x){return x[1]===tw[1]})).some(function(x){return talts(x[0]).indexOf(v)>-1});
 tst=1;$('ti').disabled=true;$('th2').style.display='none';$('tc').textContent='Keyingi →';
 if(ok){score++;mark(tw,8);$('tf').textContent="To'g'ri! ✓";$('tf').className='msg ok'}
 else{$('tf').textContent="Noto'g'ri. To'g'risi: "+tw[0];$('tf').className='msg no'}
}
$('tc').onclick=function(){if(tst===2)startT();else if(tst===1){i++;task()}else check()};
$('th2').onclick=function(){$('th').textContent=tw[0].replace(/\[[^\]]*\]|\([^)]*\)/g,'').split('/')[0].trim().split(/\s+/).map(function(x){return x.charAt(0)+x.slice(1).replace(/./g,'_')}).join('   ')};
$('tbk').onclick=goMode;
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&$('typ').classList.contains('on'))$('tc').onclick()});
/* theme */
function dark(){var d=document.documentElement.getAttribute('data-theme');if(d)return d==='dark';return window.matchMedia('(prefers-color-scheme: dark)').matches}
function apply(t){document.documentElement.setAttribute('data-theme',t);$('nm').textContent=t==='dark'?'Light mode':'Dark mode'}
try{var sv=localStorage.getItem('theme');if(sv)apply(sv);else apply(dark()?'dark':'light')}catch(e){apply(dark()?'dark':'light')}
